stages:
  - build
  - test

build:pic32:
  stage: build
  image: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl make unzip python3
    - sh install-toolchain.sh
    - make -j"$(nproc)"
    # clang-tidy and cppcheck (pinned in the Makefile) run through uvx
    - curl -LsSf https://astral.sh/uv/0.13.9/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
    - make -j"$(nproc)" lint
  artifacts:
    name: "stickos2-firmware-$CI_COMMIT_SHA"
    paths:
      - out/pic32.X.production.hex
      - out/pic32.X.production.elf
      - out/pic32.X.production.map
      - out/memoryfile.xml

test:host:
  stage: test
  image: gcc:14
  needs: []
  script:
    - make test

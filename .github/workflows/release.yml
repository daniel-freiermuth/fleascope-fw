# Release on version bump: when src/main.h's VERSION on main has no v<VERSION>
# tag yet, build and check exactly like build.yml/test.yml, then tag the commit
# and publish a GitHub release with the firmware attached and the version's
# CHANGELOG.md section as notes. Tagging and releasing share one job because a
# tag pushed with GITHUB_TOKEN does not trigger other workflows.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^#define VERSION *"\(.*\)"$/\1/p' src/main.h)
          [ -n "$version" ] || { echo "no VERSION in src/main.h" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # the "## [VERSION] — date" section, up to the next "---" or "## "
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^---/ || /^## /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for [$VERSION]" >&2; exit 1; }

      - name: Install XC32 and PIC32MK-GP DFP
        if: steps.version.outputs.release == 'true'
        run: sudo sh install-toolchain.sh

      - uses: astral-sh/setup-uv@v10.4.0
        if: steps.version.outputs.release == 'true'
        with:
          version: "0.13.9"

      - name: Build, check and test
        if: steps.version.outputs.release == 'true'
        run: |
          make -j"$(nproc)" all lint
          make -j"$(nproc)" SODEBUG=1 BUILD_DIR=out/sodebug all lint
          make test

      - name: Tag and publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          checksum=$(python3 tools/flash-checksum.py out/pic32.X.production.hex out/pic32.X.production.elf)
          mkdir dist
          for ext in hex elf map; do
            cp "out/pic32.X.production.$ext" "dist/fleascope-fw-$VERSION.$ext"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          {
            echo "Install \`fleascope-fw-$VERSION.hex\` with the \`upgrade\` command."
            echo "Afterwards \`ver\` reports \`$VERSION (checksum $checksum)\`."
            echo
            cat notes.md
          } > release-notes.md
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md

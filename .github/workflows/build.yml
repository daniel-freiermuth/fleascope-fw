name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-pic32:
    runs-on: ubuntu-24.04
    steps:
      # Build and name the PR head (like GitLab's $CI_COMMIT_SHA), not GitHub's synthetic merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install XC32 and PIC32MK-GP DFP
        run: sudo sh install-toolchain.sh

      - name: Build firmware
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v7
        with:
          name: stickos2-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/pic32.X.production.hex
            out/pic32.X.production.elf
            out/pic32.X.production.map
            out/memoryfile.xml

      # clang-tidy and cppcheck (pinned in the Makefile) run through uvx
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"

      - name: Static analysis
        run: make -j"$(nproc)" lint

      # the debug configuration (assert()s, `#if SODEBUG`) must stay warning-free too
      - name: Debug build and static analysis (SODEBUG=1)
        run: make -j"$(nproc)" SODEBUG=1 BUILD_DIR=out/sodebug all lint

name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-pic32:
    runs-on: ubuntu-24.04
    steps:
      # Build and name the PR head (like GitLab's $CI_COMMIT_SHA), not GitHub's synthetic merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install XC32 and PIC32MK-GP DFP
        run: sudo sh install-toolchain.sh

      - name: Build firmware
        working-directory: pic32.X
        run: make -f nbproject/Makefile-MK_GPK.mk SUBPROJECTS= .build-conf

      - uses: actions/upload-artifact@v4
        with:
          name: stickos2-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: pic32.X/dist/

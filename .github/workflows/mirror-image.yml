name: mirror-image
on: push
permissions:
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          src=registry.gitlab.entrop.mywire.org/fleascope/stickos2/stickos2-compile:2025-09-09
          dst=ghcr.io/${{ github.repository_owner }}/stickos2-compile:2025-09-09
          docker pull "$src"
          docker tag "$src" "$dst"
          docker push "$dst"
